
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="counter">
        <h1 class="counter__title">Counter</h1>

        <div class="counter__value">0</div>

        <div class="counter__buttons">
            <button class="btn btn--decrease" type="button">
                − Decrease
            </button>

            <button class="btn btn--increase" type="button">
                + Increase
            </button>
        </div>

        <button class="btn btn--reset" type="button">
            Reset
        </button>
    </div>
    <script src="index.js"></script>
</body>
</html>
